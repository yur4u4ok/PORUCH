[project]
name = "poruch-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["S101", "S105", "S106", "B904", "DJ001", "E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"config/settings/*" = ["F405", "F403"]
"**/management/commands/seed_demo_data.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --reuse-db --ds=config.settings.test"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore:No directory at:UserWarning"]
