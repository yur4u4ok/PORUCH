<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{ subject }}</title>
  </head>
  {# Email clients ignore <style> and CSS variables: everything is inline, tables for layout. #}
  <body style="margin:0;padding:0;background:#f3f6f5;font-family:Arial,Helvetica,sans-serif;color:#17302d;">
    <div style="display:none;max-height:0;overflow:hidden;">{{ preheader }}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f6f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
            <tr>
              <td style="padding:0 4px 16px;">
                <img src="{{ site_url }}/icons/icon-192.png" width="40" height="40" alt="" style="vertical-align:middle;border:0;" />
                <span style="font-size:22px;font-weight:bold;color:#0e5a54;vertical-align:middle;padding-left:8px;">Poruch</span>
              </td>
            </tr>
            <tr>
              <td style="background:#ffffff;border:1px solid #d3dedb;border-radius:14px;padding:28px 28px 24px;">
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#17302d;">{{ heading }}</h1>
                {% for paragraph in paragraphs %}
                  <p style="margin:0 0 14px;font-size:16px;line-height:1.5;">{{ paragraph }}</p>
                {% endfor %}
                {% if button_url %}
                  <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 18px;">
                    <tr>
                      <td style="background:#0e5a54;border-radius:12px;">
                        <a href="{{ button_url }}" style="display:inline-block;padding:14px 26px;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ button_text }}</a>
                      </td>
                    </tr>
                  </table>
                  <p style="margin:0 0 14px;font-size:13px;line-height:1.5;color:#546b67;">
                    Якщо кнопка не працює, скопіюйте посилання в браузер:<br />
                    <a href="{{ button_url }}" style="color:#0e5a54;word-break:break-all;">{{ button_url }}</a>
                  </p>
                {% endif %}
                {% if note %}
                  <p style="margin:12px 0 0;font-size:13px;line-height:1.5;color:#546b67;">{{ note }}</p>
                {% endif %}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 4px 0;font-size:12px;line-height:1.5;color:#546b67;">
                Ви отримали цей лист, бо маєте обліковий запис у Poruch — застосунку взаємодопомоги між людьми поруч.
                Питання? Просто дайте відповідь на цей лист.<br />
                <a href="{{ site_url }}/privacy" style="color:#546b67;">Політика конфіденційності</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
