# Serves the PWA and reverse-proxies API, WebSocket, admin and backend static files.

# Behind Caddy (TLS) the original scheme arrives in X-Forwarded-Proto; keep it, or Django would
# think the request is plain HTTP and redirect forever.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    # Real client IP from Caddy (rate limits, logs).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header X-Robots-Tag "noindex" always;
    }
    location /ws/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
    }
    location ~ ^/(admin|static|health|r)/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Service worker and manifest must never be cached long.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # Private app routes are not indexable; the landing page (/) is.
    location ~ ^/(help|chats|chat|profile|settings|nearby|notifications|onboarding|auth)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
    location / {
        try_files $uri /index.html;
    }
}
