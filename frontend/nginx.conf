# Serves the PWA and reverse-proxies API, WebSocket, admin and backend static files.

# Behind Caddy (TLS) the original scheme arrives in X-Forwarded-Proto; keep it, or Django would
# think the request is plain HTTP and redirect forever.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    # Re-resolve the backend through Docker's DNS: after the backend container is recreated it gets
    # a new IP, and a hostname resolved once at startup would give 502 until Nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend ${BACKEND_UPSTREAM};
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    # Real client IP from Caddy (rate limits, logs).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
    }
    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
    }
    location ~ ^/(admin|static|health|r)/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Service worker and manifest must never be cached long.
    location = /sw.js { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /assets/ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # Private app routes are not indexable; the landing page (/) is.
    location ~ ^/(help|chats|chat|profile|settings|nearby|notifications|onboarding|auth|share|support)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # The app shell must never be cached: after a deploy it points to new JS chunk names.
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # The app shell must never be cached: after a deploy it points to new JS chunk names.
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
