<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E5A54" />
    <!-- Google Search Console ownership (URL-prefix property poruch-app.duckdns.org) -->
    <meta name="google-site-verification" content="sb8DOBvb6MQmqakPp3aFxbX8-jXU_5k73mCLSmMDWMc" />
    <meta
      name="description"
      content="Poruch — локальна мережа взаємодопомоги. Попроси допомогу в людей поруч або допоможи сам."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Poruch" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Static landing copy for crawlers without JavaScript; hidden as soon as JS runs. */
      .js .seo-fallback {
        display: none;
      }
    </style>
    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("poruch.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <title>Poruch</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
