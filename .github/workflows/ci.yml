name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: poruch
          POSTGRES_USER: poruch
          POSTGRES_PASSWORD: poruch
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U poruch" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgis://poruch:poruch@localhost:5432/poruch
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL/GEOS/PROJ
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install
        run: pip install -r requirements/dev.txt
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Typecheck
        run: mypy .
      - name: Migrations
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - name: Tests
        run: pytest --create-db

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --target production -t poruch-backend:${{ github.sha }} backend
      - name: Build frontend image
        run: docker build --target production -t poruch-frontend:${{ github.sha }} frontend

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Install before the stack starts: the frontend container bind-mounts ./frontend and would
      # otherwise create frontend/node_modules as root, so npm ci on the runner gets EACCES.
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300 postgres redis s3 mailpit backend celery frontend
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend celery
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
